[project]
name = "entschied"
version = "0.1.0"
description = "Run decision-maker AI models locally"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["tinyjev[torch]", "PySide6", "httpx", "huggingface_hub", "mcp[cli]<2"]

[project.scripts]
entschied = "entschied.app:main"
entschied-mcp = "entschied.mcp:main"
entschied-serve = "entschied.serve:main"
entschied-gpu-setup = "entschied.gpu_setup:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["entschied"]
