openapi: 3.1.0
info:
  title: TinyJev Local API
  version: 1.1.0
  description: |
    TinyJev local decision API exposed by `tinyjev_gui.serve`.

    Notes for callers:
    - `state` is the only context available to the model.
    - Keep `state` under about 8K tokens.
    - TinyJev has no memory between requests.
    - Outputs are calibrated probabilities; low confidence should be treated as uncertainty.
servers:
  - url: http://127.0.0.1:8077
paths:
  /health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        '200':
          description: Server is reachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /v1/systemone:
    post:
      operationId: runSystemOne
      summary: Evaluate one or more TinyJev questions on a shared state
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SystemOneRequest'
      responses:
        '200':
          description: Decision outputs per question key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemOneResponse'
        '400':
          description: Invalid request payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    HealthResponse:
      type: object
      properties:
        ready:
          type: boolean
          description: True when model is loaded and ready.
      additionalProperties: true
    SystemOneRequest:
      type: object
      required: [state, questions]
      properties:
        state:
          type: string
          description: Full context text for the decision.
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Optional request-level confidence cutoff.
        use_confidence_cutoff:
          type: boolean
          description: If true and min_confidence is omitted, applies the default 0.70 cutoff.
        questions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/QuestionSpec'
    QuestionSpec:
      type: object
      required: [type, instructions]
      properties:
        type:
          type: string
          enum: [noul, choice, score]
        instructions:
          type: string
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: Optional question-level cutoff that overrides request-level min_confidence.
        criteria:
          description: Required for `choice` and `score`.
          oneOf:
            - type: object
              additionalProperties:
                type: string
            - type: array
              items:
                type: string
      additionalProperties: false
    SystemOneResponse:
      type: object
      required: [answers]
      properties:
        answers:
          type: object
          description: Map from question key to model-specific result payload.
          additionalProperties:
            $ref: '#/components/schemas/Answer'
      additionalProperties: true
    Answer:
      oneOf:
        - $ref: '#/components/schemas/NoulAnswer'
        - $ref: '#/components/schemas/ChoiceAnswer'
        - $ref: '#/components/schemas/ScoreAnswer'
    NoulAnswer:
      type: object
      required: [type, noul]
      properties:
        type:
          const: noul
        noul:
          oneOf:
            - type: number
            - type: string
              enum: [unsure]
        probabilities:
          type: object
          additionalProperties:
            type: number
        raw_answer:
          type: string
        unsure:
          type: boolean
        decided:
          type: boolean
        defer:
          type: boolean
      additionalProperties: true
    ChoiceAnswer:
      type: object
      required: [type, choice, probabilities]
      properties:
        type:
          const: choice
        choice:
          type: string
        raw_choice:
          type: string
        confidence:
          type: number
        probabilities:
          type: object
          additionalProperties:
            type: number
        unsure:
          type: boolean
        decided:
          type: boolean
        defer:
          type: boolean
      additionalProperties: true
    ScoreAnswer:
      type: object
      required: [type, score, probabilities]
      properties:
        type:
          const: score
        score:
          oneOf:
            - type: number
            - type: string
              enum: [unsure]
        raw_score:
          type: number
        confidence:
          type: number
        legend:
          type: array
          items:
            type: string
        probabilities:
          type: array
          items:
            type: number
        unsure:
          type: boolean
        decided:
          type: boolean
        defer:
          type: boolean
      additionalProperties: true
    ErrorResponse:
      type: object
      additionalProperties: true
